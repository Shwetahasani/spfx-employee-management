<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Employee Management · SPFx + React demo</title>
<meta name="description" content="Live demo of an Employee Management web part built with SharePoint Framework (SPFx) and React.">
<style>
  :root {
    --ink: #23313a;
    --muted: #5f6f78;
    --teal: #0e4d5a;
    --teal-hover: #0a3a45;
    --teal-soft: #e3eff1;
    --page: #f3f5f6;
    --surface: #ffffff;
    --mist: #f5f8f9;
    --line: #dce4e7;
    --active: #2e7d5b;
    --leave: #b7791f;
    --inactive: #8a969d;
    --danger: #b3261e;
    --danger-soft: #fbeaea;
    --success-soft: #e6f3ec;
    --suite: #0e4d5a;
    --suite-text: #ffffff;
    --overlay: rgba(20, 30, 36, 0.4);
    --focus: #0e4d5a;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #e4eaed;
      --muted: #9aa8b0;
      --teal: #6cc2d1;
      --teal-hover: #8fd3df;
      --teal-soft: #17343b;
      --page: #12181b;
      --surface: #1b2327;
      --mist: #222c31;
      --line: #33424a;
      --active: #5cc08f;
      --leave: #e0a84a;
      --inactive: #8a969d;
      --danger: #f08b84;
      --danger-soft: #3a2020;
      --success-soft: #1d3329;
      --suite: #0b2e36;
      --suite-text: #e4eaed;
      --overlay: rgba(0, 0, 0, 0.6);
      --focus: #6cc2d1;
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 14px;
    color: var(--ink);
    background: var(--page);
    line-height: 1.45;
  }
  button, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  /* SharePoint-style suite bar */
  .suite {
    display: flex; align-items: center; gap: 14px;
    height: 48px; padding: 0 16px;
    background: var(--suite); color: var(--suite-text);
  }
  .suite .waffle { display: grid; grid-template-columns: repeat(3, 4px); gap: 3px; }
  .suite .waffle span { width: 4px; height: 4px; background: currentColor; border-radius: 1px; }
  .suite .brand { font-weight: 600; font-size: 16px; }
  .suite .site { opacity: 0.85; border-left: 1px solid rgba(255,255,255,0.3); padding-left: 14px; }
  .suite .me {
    margin-left: auto; width: 30px; height: 30px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,0.18); font-size: 12px; font-weight: 600;
  }

  .notice {
    max-width: 1200px; margin: 16px auto 0; padding: 10px 16px;
    display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center;
    background: var(--teal-soft); border-radius: 6px; font-size: 13px;
  }
  .notice a { color: var(--teal); font-weight: 600; }
  .notice .spacer { flex: 1; }

  .canvas { max-width: 1200px; margin: 16px auto 40px; padding: 0 16px; }

  /* Web part */
  .wp { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .wp-header {
    display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px;
    padding: 20px 24px 14px; border-bottom: 1px solid var(--line);
  }
  .wp-title { margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -0.01em; color: var(--teal); }
  .wp-sub { margin: 4px 0 0; font-size: 13px; color: var(--muted); }
  .wp-body { padding: 0 24px 24px; }

  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    height: 32px; padding: 0 14px; border-radius: 4px; cursor: pointer;
    border: 1px solid var(--line); background: var(--surface); font-weight: 600; white-space: nowrap;
  }
  .btn:hover { background: var(--mist); }
  .btn:disabled { opacity: 0.5; cursor: default; }
  .btn-primary { background: var(--teal); border-color: var(--teal); color: #fff; }
  .btn-primary:hover { background: var(--teal-hover); border-color: var(--teal-hover); }
  @media (prefers-color-scheme: dark) { .btn-primary { color: #0b1a1e; } }
  .btn-danger { background: var(--danger); border-color: var(--danger); color: #fff; }
  .btn-danger:hover { filter: brightness(0.92); }
  .icon-btn {
    width: 32px; height: 32px; border: 0; background: transparent; border-radius: 4px;
    display: inline-flex; align-items: center; justify-content: center; cursor: pointer; color: var(--teal);
  }
  .icon-btn:hover { background: var(--mist); }
  .icon-btn:disabled { opacity: 0.35; cursor: default; }
  svg.i { width: 16px; height: 16px; flex: 0 0 16px; }

  /* Tabs */
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin: 0 -24px 16px; padding: 0 16px; }
  .tab {
    display: inline-flex; align-items: center; gap: 6px;
    background: none; border: 0; padding: 12px 10px 10px; cursor: pointer;
    color: var(--muted); font-weight: 600; border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--teal); }

  /* Toolbar */
  .toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; margin-bottom: 8px; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field > span { font-size: 13px; font-weight: 600; }
  .search { position: relative; flex: 1 1 260px; }
  .search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); }
  .input, .select {
    height: 32px; width: 100%; padding: 0 10px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface);
  }
  .search .input { padding-left: 32px; }
  .select { padding-right: 6px; min-width: 170px; }
  .input.invalid { border-color: var(--danger); }
  .count { font-size: 12px; color: var(--muted); margin: 6px 0 8px; }

  /* Table */
  .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 6px; }
  table { width: 100%; border-collapse: collapse; min-width: 820px; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tbody tr:last-child td { border-bottom: 0; }
  tbody tr:hover { background: var(--mist); }
  th { font-size: 12px; font-weight: 600; color: var(--muted); background: var(--mist); }
  th button { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
  th button:focus-visible { outline: 2px solid var(--focus); }
  .sort-ind { font-size: 10px; }

  .name-cell { display: flex; align-items: center; gap: 10px; }
  .avatar {
    flex: 0 0 32px; width: 32px; height: 32px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 600; color: #fff;
  }
  .name-text { display: flex; flex-direction: column; line-height: 1.25; }
  .name-text strong { font-weight: 600; }
  .name-text span { font-size: 12px; color: var(--muted); }
  .status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; white-space: nowrap; }
  .status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .s-active { color: var(--active); } .s-leave { color: var(--leave); } .s-inactive { color: var(--inactive); }
  .actions { white-space: nowrap; }

  .pager { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; font-size: 13px; color: var(--muted); }

  .empty { padding: 40px 16px; text-align: center; background: var(--mist); border-radius: 6px; }
  .empty h3 { margin: 0 0 6px; font-size: 16px; }
  .empty p { margin: 0 0 16px; color: var(--muted); }

  /* Dashboard */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); border: 1px solid var(--line); border-radius: 6px; margin-bottom: 24px; }
  .stat { padding: 16px 18px; border-right: 1px solid var(--line); }
  .stat:last-child { border-right: 0; }
  .stat-v { font-size: 30px; font-weight: 600; color: var(--teal); line-height: 1.1; }
  .stat-l { font-size: 13px; color: var(--muted); margin-top: 4px; }
  @media (max-width: 640px) { .stat { border-right: 0; border-bottom: 1px solid var(--line); } .stat:last-child { border-bottom: 0; } }
  .dash { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 32px; }
  @media (max-width: 760px) { .dash { grid-template-columns: 1fr; } }
  .sec-title { font-size: 15px; font-weight: 600; margin: 0 0 12px; }
  .dept-row { display: grid; grid-template-columns: 130px 1fr 32px; align-items: center; gap: 10px; margin-bottom: 10px; font-size: 13px; }
  .dept-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar { display: flex; height: 14px; background: var(--mist); border-radius: 7px; overflow: hidden; }
  .seg { height: 100%; transition: width .4s ease; }
  .seg-active { background: var(--active); } .seg-leave { background: var(--leave); } .seg-inactive { background: var(--inactive); }
  .dept-count { text-align: right; font-weight: 600; }
  .legend { display: flex; gap: 16px; margin-top: 6px; }
  .recent { list-style: none; margin: 0; padding: 0; }
  .recent li { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .recent li:last-child { border-bottom: 0; }
  .recent .date { margin-left: auto; font-size: 12px; color: var(--muted); white-space: nowrap; }

  /* Panel */
  .overlay { position: fixed; inset: 0; background: var(--overlay); z-index: 20; }
  .panel {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100%); z-index: 21;
    background: var(--surface); display: flex; flex-direction: column;
    box-shadow: -8px 0 24px rgba(0,0,0,0.18); animation: slideIn .22s ease-out;
  }
  @keyframes slideIn { from { transform: translateX(40px); opacity: 0; } to { transform: none; opacity: 1; } }
  .panel-head { display: flex; align-items: center; justify-content: space-between; padding: 18px 24px; }
  .panel-head h2 { margin: 0; font-size: 20px; font-weight: 600; }
  .panel-body { flex: 1; overflow-y: auto; padding: 0 24px 16px; }
  .panel-foot { display: flex; gap: 8px; padding: 16px 24px; border-top: 1px solid var(--line); }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 16px; }
  .form-grid .full { grid-column: 1 / -1; }
  @media (max-width: 480px) { .form-grid { grid-template-columns: 1fr; } }
  .req { color: var(--danger); margin-left: 2px; }
  .err { color: var(--danger); font-size: 12px; }
  .radios { display: flex; flex-wrap: wrap; gap: 16px; padding-top: 4px; }
  .radios label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; font-weight: 400; }
  .radios input { accent-color: var(--teal); }

  /* Dialog */
  .dialog {
    position: fixed; z-index: 31; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: min(420px, calc(100% - 32px)); background: var(--surface); border-radius: 6px; padding: 24px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.25);
  }
  .dialog h2 { margin: 0 0 8px; font-size: 20px; font-weight: 600; }
  .dialog p { margin: 0 0 20px; color: var(--muted); }
  .dialog .row { display: flex; gap: 8px; justify-content: flex-end; }
  .overlay.top { z-index: 30; }

  /* Toast */
  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 40;
    display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 6px;
    background: var(--ink); color: var(--surface); box-shadow: 0 8px 24px rgba(0,0,0,0.2); font-size: 13px;
    max-width: calc(100% - 32px);
  }
  .toast .icon-btn { color: inherit; width: 24px; height: 24px; }

  footer { text-align: center; font-size: 12px; color: var(--muted); padding: 0 16px 32px; }
  footer a { color: var(--teal); }

  @media (max-width: 600px) {
    .wp-header, .wp-body { padding-left: 16px; padding-right: 16px; }
    .tabs { margin-left: -16px; margin-right: -16px; padding: 0 8px; }
    .suite .site { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .panel { animation: none; } .seg { transition: none; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.24.7/babel.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef, useCallback } = React;

// ---------- Config ----------
const REPO_URL = 'https://github.com/Shwetahasani/spfx-employee-management';
const STORAGE_KEY = 'spfx-employee-demo:v1';
const PAGE_SIZE = 8;

const DEPARTMENTS = ['Engineering', 'Human Resources', 'Finance', 'Sales', 'Marketing', 'Operations', 'Support'];
const STATUSES = ['Active', 'On Leave', 'Inactive'];
const DEPT_COLORS = {
  Engineering: '#0e4d5a', 'Human Resources': '#7a4e8c', Finance: '#2f5d8a', Sales: '#a8442f',
  Marketing: '#b0567a', Operations: '#4f6b2e', Support: '#6b5a2e'
};

// Fictional sample data (example.com addresses)
const SAMPLE = [
  ['Aarav Sharma', 'EMP-1001', 'Engineering', 'Senior Developer', '2023-04-10', 'Active'],
  ['Meera Iyer', 'EMP-1002', 'Human Resources', 'HR Business Partner', '2022-08-01', 'Active'],
  ['Rohan Verma', 'EMP-1003', 'Finance', 'Financial Analyst', '2024-01-15', 'On Leave'],
  ['Sara Thomas', 'EMP-1004', 'Sales', 'Account Executive', '2025-06-02', 'Active'],
  ['Kabir Mehta', 'EMP-1005', 'Engineering', 'QA Engineer', '2021-11-22', 'Inactive'],
  ['Ananya Gupta', 'EMP-1006', 'Marketing', 'Content Strategist', '2026-09-14', 'Active'],
  ['Vikram Nair', 'EMP-1007', 'Operations', 'Operations Manager', '2020-03-09', 'Active'],
  ['Priya Kulkarni', 'EMP-1008', 'Engineering', 'Frontend Developer', '2026-08-03', 'Active'],
  ['Arjun Reddy', 'EMP-1009', 'Support', 'Support Lead', '2022-12-05', 'Active'],
  ['Nisha Joshi', 'EMP-1010', 'Finance', 'Accounts Executive', '2025-02-17', 'Active'],
  ['Farhan Qureshi', 'EMP-1011', 'Sales', 'Regional Sales Manager', '2019-07-29', 'On Leave'],
  ['Divya Menon', 'EMP-1012', 'Engineering', 'SharePoint Developer', '2026-10-06', 'Active'],
  ['Karan Malhotra', 'EMP-1013', 'Marketing', 'SEO Specialist', '2023-09-18', 'Inactive'],
  ['Ishita Bose', 'EMP-1014', 'Human Resources', 'Talent Acquisition', '2024-06-24', 'Active'],
  ['Siddharth Rao', 'EMP-1015', 'Engineering', 'Tech Lead', '2021-05-03', 'Active'],
  ['Pooja Singh', 'EMP-1016', 'Support', 'Support Engineer', '2025-11-10', 'Active'],
  ['Manish Patel', 'EMP-1017', 'Operations', 'Logistics Coordinator', '2024-10-21', 'On Leave'],
  ['Tanvi Deshpande', 'EMP-1018', 'Engineering', 'UI Designer', '2026-07-01', 'Active']
].map(([fullName, employeeCode, department, designation, joiningDate, status], i) => ({
  id: i + 1,
  fullName, employeeCode, department, designation, joiningDate, status,
  email: fullName.toLowerCase().replace(/\s+/g, '.') + '@example.com',
  phone: '+91 90000 ' + String(10001 + i * 37).slice(-5)
}));

// ---------- Fake "SharePoint list" service (same methods as EmployeeService.ts) ----------
const delay = (ms) => new Promise(r => setTimeout(r, ms));
const store = {
  read() {
    try { const raw = localStorage.getItem(STORAGE_KEY); if (raw) return JSON.parse(raw); } catch (e) {}
    return SAMPLE.map(e => ({ ...e }));
  },
  write(list) { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(list)); } catch (e) {} }
};
const service = {
  async getAll() { await delay(350); return store.read(); },
  async create(emp) {
    await delay(250);
    const list = store.read();
    const id = list.reduce((m, e) => Math.max(m, e.id), 0) + 1;
    const created = normalize({ ...emp, id });
    store.write([...list, created]);
    return created;
  },
  async update(emp) {
    await delay(250);
    store.write(store.read().map(e => (e.id === emp.id ? normalize(emp) : e)));
  },
  async remove(id) { await delay(200); store.write(store.read().filter(e => e.id !== id)); },
  async isCodeTaken(code, excludeId) {
    return store.read().some(e => e.employeeCode.toUpperCase() === code.toUpperCase() && e.id !== excludeId);
  },
  reset() { try { localStorage.removeItem(STORAGE_KEY); } catch (e) {} }
};
function normalize(e) {
  return {
    ...e,
    fullName: e.fullName.trim(),
    employeeCode: e.employeeCode.trim().toUpperCase(),
    email: e.email.trim().toLowerCase(),
    phone: e.phone.trim(),
    designation: e.designation.trim()
  };
}

// ---------- Helpers ----------
const initials = (name) => name.split(/\s+/).filter(Boolean).slice(0, 2).map(p => p[0].toUpperCase()).join('') || '?';
const deptColor = (d) => DEPT_COLORS[d] || '#5f6f78';
const statusClass = (s) => (s === 'Active' ? 's-active' : s === 'On Leave' ? 's-leave' : 's-inactive');
const formatDate = (iso) => {
  if (!iso) return '';
  const d = new Date(iso + 'T00:00:00');
  return isNaN(d) ? iso : d.toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
};
const todayIso = () => {
  const d = new Date();
  const p = (n) => (n < 10 ? '0' + n : '' + n);
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
};
const emptyEmployee = () => ({
  fullName: '', employeeCode: '', email: '', phone: '',
  department: DEPARTMENTS[0], designation: '', joiningDate: todayIso(), status: 'Active'
});

const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
const PHONE_RE = /^[+()\-\s\d]{7,20}$/;
const CODE_RE = /^[A-Za-z0-9-]{2,20}$/;
function validate(e) {
  const errors = {};
  if (!e.fullName.trim()) errors.fullName = 'Enter the employee’s full name.';
  if (!e.employeeCode.trim()) errors.employeeCode = 'Enter an employee ID.';
  else if (!CODE_RE.test(e.employeeCode.trim())) errors.employeeCode = 'Use 2–20 letters, numbers or hyphens.';
  if (!e.email.trim()) errors.email = 'Enter a work email.';
  else if (!EMAIL_RE.test(e.email.trim())) errors.email = 'Enter an email like name@company.com.';
  if (e.phone.trim() && !PHONE_RE.test(e.phone.trim())) errors.phone = 'Use digits, spaces, +, ( ) or -.';
  if (!e.designation.trim()) errors.designation = 'Enter a designation.';
  if (!e.joiningDate) errors.joiningDate = 'Pick a joining date.';
  return errors;
}

// ---------- Icons ----------
const PATHS = {
  plus: 'M8 2v12M2 8h12',
  edit: 'M11 2.5l2.5 2.5L6 12.5H3.5V10z',
  trash: 'M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.6 9h5.8l.6-9',
  search: 'M7 12A5 5 0 1 0 7 2a5 5 0 0 0 0 10zM10.6 10.6L14 14',
  download: 'M8 2v8M4.5 6.5L8 10l3.5-3.5M3 13.5h10',
  left: 'M10 3L5 8l5 5',
  right: 'M6 3l5 5-5 5',
  close: 'M3.5 3.5l9 9M12.5 3.5l-9 9',
  people: 'M6 7.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5zM1.5 13.5c0-2.5 2-4 4.5-4s4.5 1.5 4.5 4M11 7a2 2 0 1 0 0-4M12 9.5c1.6.4 2.5 1.7 2.5 4',
  chart: 'M2.5 13.5h11M4.5 11V7M8 11V3.5M11.5 11V8.5',
  reset: 'M2.5 8a5.5 5.5 0 1 0 1.6-3.9M2.5 2.5v3h3'
};
const Icon = ({ name }) => (
  <svg className="i" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
    <path d={PATHS[name]} />
  </svg>
);

const Avatar = ({ emp }) => (
  <span className="avatar" style={{ background: deptColor(emp.department) }} aria-hidden="true">{initials(emp.fullName)}</span>
);

// ---------- Directory ----------
function Directory({ employees, onAdd, onEdit, onDelete }) {
  const [query, setQuery] = useState('');
  const [dept, setDept] = useState('all');
  const [status, setStatus] = useState('all');
  const [sortKey, setSortKey] = useState('fullName');
  const [sortDesc, setSortDesc] = useState(false);
  const [page, setPage] = useState(0);

  useEffect(() => setPage(0), [query, dept, status]);

  const filtered = useMemo(() => {
    const q = query.trim().toLowerCase();
    return employees
      .filter(e => (dept === 'all' || e.department === dept) && (status === 'all' || e.status === status))
      .filter(e => !q || [e.fullName, e.employeeCode, e.email, e.designation, e.phone].some(v => (v || '').toLowerCase().includes(q)))
      .sort((a, b) => {
        const av = String(a[sortKey] || '').toLowerCase(), bv = String(b[sortKey] || '').toLowerCase();
        const c = av < bv ? -1 : av > bv ? 1 : 0;
        return sortDesc ? -c : c;
      });
  }, [employees, query, dept, status, sortKey, sortDesc]);

  const pageCount = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
  const cur = Math.min(page, pageCount - 1);
  const rows = filtered.slice(cur * PAGE_SIZE, cur * PAGE_SIZE + PAGE_SIZE);

  const sortBy = (key) => {
    if (key === sortKey) setSortDesc(!sortDesc);
    else { setSortKey(key); setSortDesc(false); }
  };
  const th = (k, children) => (
    <th aria-sort={sortKey === k ? (sortDesc ? 'descending' : 'ascending') : 'none'}>
      <button onClick={() => sortBy(k)}>
        {children}
        {sortKey === k && <span className="sort-ind" aria-hidden="true">{sortDesc ? '▼' : '▲'}</span>}
      </button>
    </th>
  );

  const exportCsv = () => {
    const header = ['Employee ID', 'Full name', 'Email', 'Phone', 'Department', 'Designation', 'Joining date', 'Status'];
    const esc = (v) => `"${String(v || '').replace(/"/g, '""')}"`;
    const lines = filtered.map(e => [e.employeeCode, e.fullName, e.email, e.phone, e.department, e.designation, e.joiningDate, e.status].map(esc).join(','));
    const blob = new Blob([[header.join(','), ...lines].join('\r\n')], { type: 'text/csv;charset=utf-8;' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `employees-${todayIso()}.csv`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };

  if (!employees.length) {
    return (
      <div className="empty">
        <h3>No employees yet</h3>
        <p>Add the first person to start building your directory.</p>
        <button className="btn btn-primary" onClick={onAdd}><Icon name="plus" />Add employee</button>
      </div>
    );
  }

  return (
    <div>
      <div className="toolbar">
        <label className="field search">
          <span className="sr-label" style={{ position: 'absolute', left: -9999 }}>Search employees</span>
          <Icon name="search" />
          <input className="input" type="search" placeholder="Search by name, ID, email or designation"
            value={query} onChange={e => setQuery(e.target.value)} />
        </label>
        <label className="field">
          <span>Department</span>
          <select className="select" value={dept} onChange={e => setDept(e.target.value)}>
            <option value="all">All departments</option>
            {DEPARTMENTS.map(d => <option key={d} value={d}>{d}</option>)}
          </select>
        </label>
        <label className="field">
          <span>Status</span>
          <select className="select" value={status} onChange={e => setStatus(e.target.value)}>
            <option value="all">All statuses</option>
            {STATUSES.map(s => <option key={s} value={s}>{s}</option>)}
          </select>
        </label>
        <button className="btn" onClick={exportCsv} disabled={!filtered.length}><Icon name="download" />Export CSV</button>
      </div>

      <p className="count" aria-live="polite">Showing {filtered.length} of {employees.length} employees</p>

      {filtered.length === 0 ? (
        <div className="empty">
          <h3>No matches</h3>
          <p>Try a different search term or clear the filters.</p>
          <button className="btn" onClick={() => { setQuery(''); setDept('all'); setStatus('all'); }}>Clear filters</button>
        </div>
      ) : (
        <>
          <div className="table-wrap">
            <table>
              <thead>
                <tr>
                  {th('fullName', 'Name')}
                  {th('employeeCode', 'Employee ID')}
                  {th('department', 'Department')}
                  {th('designation', 'Designation')}
                  {th('joiningDate', 'Joined')}
                  {th('status', 'Status')}
                  <th><span style={{ position: 'absolute', left: -9999 }}>Actions</span></th>
                </tr>
              </thead>
              <tbody>
                {rows.map(e => (
                  <tr key={e.id} onDoubleClick={() => onEdit(e)}>
                    <td>
                      <div className="name-cell">
                        <Avatar emp={e} />
                        <span className="name-text"><strong>{e.fullName}</strong><span>{e.email}</span></span>
                      </div>
                    </td>
                    <td>{e.employeeCode}</td>
                    <td>{e.department}</td>
                    <td>{e.designation}</td>
                    <td style={{ whiteSpace: 'nowrap' }}>{formatDate(e.joiningDate)}</td>
                    <td><span className={'status ' + statusClass(e.status)}>{e.status}</span></td>
                    <td className="actions">
                      <button className="icon-btn" title={'Edit ' + e.fullName} aria-label={'Edit ' + e.fullName} onClick={() => onEdit(e)}><Icon name="edit" /></button>
                      <button className="icon-btn" title={'Delete ' + e.fullName} aria-label={'Delete ' + e.fullName} onClick={() => onDelete(e)}><Icon name="trash" /></button>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <div className="pager">
            <span>Page {cur + 1} of {pageCount}</span>
            <div>
              <button className="icon-btn" aria-label="Previous page" disabled={cur === 0} onClick={() => setPage(cur - 1)}><Icon name="left" /></button>
              <button className="icon-btn" aria-label="Next page" disabled={cur >= pageCount - 1} onClick={() => setPage(cur + 1)}><Icon name="right" /></button>
            </div>
          </div>
        </>
      )}
    </div>
  );
}

// ---------- Dashboard ----------
function Dashboard({ employees }) {
  const s = useMemo(() => {
    const cutoff = new Date(Date.now() - 90 * 864e5);
    const count = (st) => employees.filter(e => e.status === st).length;
    const depts = DEPARTMENTS.map(name => {
      const list = employees.filter(e => e.department === name);
      return {
        name, total: list.length,
        by: { Active: list.filter(e => e.status === 'Active').length, 'On Leave': list.filter(e => e.status === 'On Leave').length, Inactive: list.filter(e => e.status === 'Inactive').length }
      };
    }).filter(d => d.total).sort((a, b) => b.total - a.total);
    return {
      total: employees.length, active: count('Active'), leave: count('On Leave'),
      newHires: employees.filter(e => e.joiningDate && new Date(e.joiningDate) >= cutoff).length,
      depts, max: depts.length ? depts[0].total : 1,
      recent: [...employees].filter(e => e.joiningDate).sort((a, b) => (a.joiningDate < b.joiningDate ? 1 : -1)).slice(0, 6)
    };
  }, [employees]);

  if (!employees.length) {
    return <div className="empty"><h3>Nothing to report yet</h3><p>The dashboard fills in as you add employees in the Directory tab.</p></div>;
  }
  const SEG = { Active: 'seg-active', 'On Leave': 'seg-leave', Inactive: 'seg-inactive' };

  return (
    <div>
      <div className="stats">
        <div className="stat"><div className="stat-v">{s.total}</div><div className="stat-l">Total employees</div></div>
        <div className="stat"><div className="stat-v">{s.active}</div><div className="stat-l">Active</div></div>
        <div className="stat"><div className="stat-v">{s.leave}</div><div className="stat-l">On leave</div></div>
        <div className="stat"><div className="stat-v">{s.newHires}</div><div className="stat-l">Joined in the last 90 days</div></div>
      </div>
      <div className="dash">
        <div>
          <h3 className="sec-title">Headcount by department</h3>
          {s.depts.map(d => (
            <div className="dept-row" key={d.name}>
              <span className="dept-name" title={d.name}>{d.name}</span>
              <div className="bar" role="img" aria-label={`${d.name}: ${d.by.Active} active, ${d.by['On Leave']} on leave, ${d.by.Inactive} inactive`}>
                {STATUSES.map(st => d.by[st] ? <div key={st} className={'seg ' + SEG[st]} style={{ width: (d.by[st] / s.max) * 100 + '%' }} /> : null)}
              </div>
              <span className="dept-count">{d.total}</span>
            </div>
          ))}
          <div className="legend">
            <span className="status s-active">Active</span>
            <span className="status s-leave">On leave</span>
            <span className="status s-inactive">Inactive</span>
          </div>
        </div>
        <div>
          <h3 className="sec-title">Most recent joiners</h3>
          <ul className="recent">
            {s.recent.map(e => (
              <li key={e.id}>
                <Avatar emp={e} />
                <span className="name-text"><strong>{e.fullName}</strong><span>{e.designation}, {e.department}</span></span>
                <span className="date">{formatDate(e.joiningDate)}</span>
              </li>
            ))}
          </ul>
        </div>
      </div>
    </div>
  );
}

// ---------- Add / edit panel ----------
function EmployeeForm({ employee, onClose, onSaved }) {
  const isNew = !employee;
  const [form, setForm] = useState(employee ? { ...employee } : emptyEmployee());
  const [errors, setErrors] = useState({});
  const [touched, setTouched] = useState(false);
  const [saving, setSaving] = useState(false);
  const firstRef = useRef(null);

  useEffect(() => {
    firstRef.current && firstRef.current.focus();
    const onKey = (ev) => { if (ev.key === 'Escape') onClose(); };
    document.addEventListener('keydown', onKey);
    return () => document.removeEventListener('keydown', onKey);
  }, [onClose]);

  const set = (k, v) => {
    const next = { ...form, [k]: v };
    setForm(next);
    if (touched) setErrors(validate(next));
  };

  const save = async () => {
    setTouched(true);
    const found = validate(form);
    setErrors(found);
    if (Object.keys(found).length) return;
    setSaving(true);
    if (await service.isCodeTaken(form.employeeCode.trim(), form.id)) {
      setErrors({ employeeCode: 'Another employee already has this ID.' });
      setSaving(false);
      return;
    }
    if (isNew) await onSaved(await service.create(form), true);
    else { await service.update(form); await onSaved(normalize(form), false); }
  };

  const Text = ({ k, label, required, type = 'text', placeholder, full, inputRef }) => (
    <label className={'field' + (full ? ' full' : '')}>
      <span>{label}{required && <span className="req" aria-hidden="true">*</span>}</span>
      <input ref={inputRef} className={'input' + (errors[k] ? ' invalid' : '')} type={type} value={form[k]} placeholder={placeholder}
        aria-invalid={!!errors[k]} required={required} onChange={e => set(k, e.target.value)} />
      {errors[k] && <span className="err">{errors[k]}</span>}
    </label>
  );

  return (
    <>
      <div className="overlay" onClick={onClose} />
      <aside className="panel" role="dialog" aria-modal="true" aria-labelledby="panel-title">
        <div className="panel-head">
          <h2 id="panel-title">{isNew ? 'Add employee' : 'Edit ' + employee.fullName}</h2>
          <button className="icon-btn" aria-label="Close" onClick={onClose}><Icon name="close" /></button>
        </div>
        <div className="panel-body">
          <div className="form-grid">
            {Text({ k: 'fullName', label: 'Full name', required: true, full: true, inputRef: firstRef })}
            {Text({ k: 'employeeCode', label: 'Employee ID', required: true, placeholder: 'e.g. EMP-1042' })}
            <label className="field">
              <span>Department<span className="req" aria-hidden="true">*</span></span>
              <select className="select" value={form.department} onChange={e => set('department', e.target.value)}>
                {DEPARTMENTS.map(d => <option key={d} value={d}>{d}</option>)}
              </select>
            </label>
            {Text({ k: 'email', label: 'Work email', required: true, type: 'email' })}
            {Text({ k: 'phone', label: 'Phone', type: 'tel' })}
            {Text({ k: 'designation', label: 'Designation', required: true })}
            {Text({ k: 'joiningDate', label: 'Joining date', required: true, type: 'date' })}
            <fieldset className="field full" style={{ border: 0, padding: 0, margin: 0 }}>
              <span style={{ fontSize: 13, fontWeight: 600 }}>Status</span>
              <div className="radios">
                {STATUSES.map(s => (
                  <label key={s}><input type="radio" name="status" checked={form.status === s} onChange={() => set('status', s)} />{s}</label>
                ))}
              </div>
            </fieldset>
          </div>
        </div>
        <div className="panel-foot">
          <button className="btn btn-primary" disabled={saving} onClick={save}>{saving ? 'Saving…' : isNew ? 'Add employee' : 'Save changes'}</button>
          <button className="btn" disabled={saving} onClick={onClose}>Cancel</button>
        </div>
      </aside>
    </>
  );
}

// ---------- Delete confirmation ----------
function ConfirmDelete({ emp, onCancel, onConfirm }) {
  const [busy, setBusy] = useState(false);
  const cancelRef = useRef(null);
  useEffect(() => {
    cancelRef.current && cancelRef.current.focus();
    const onKey = (ev) => { if (ev.key === 'Escape') onCancel(); };
    document.addEventListener('keydown', onKey);
    return () => document.removeEventListener('keydown', onKey);
  }, [onCancel]);
  return (
    <>
      <div className="overlay top" onClick={onCancel} />
      <div className="dialog" role="alertdialog" aria-modal="true" aria-labelledby="del-title" aria-describedby="del-desc">
        <h2 id="del-title">Delete employee?</h2>
        <p id="del-desc">{emp.fullName} ({emp.employeeCode}) will be removed. In SharePoint this moves the item to the site recycle bin.</p>
        <div className="row">
          <button className="btn btn-danger" disabled={busy} onClick={async () => { setBusy(true); await onConfirm(); }}>{busy ? 'Deleting…' : 'Delete'}</button>
          <button className="btn" ref={cancelRef} onClick={onCancel}>Cancel</button>
        </div>
      </div>
    </>
  );
}

// ---------- App ----------
function App() {
  const [employees, setEmployees] = useState([]);
  const [loading, setLoading] = useState(true);
  const [tab, setTab] = useState('directory');
  const [form, setForm] = useState(null); // null | { employee?: object }
  const [toDelete, setToDelete] = useState(null);
  const [toast, setToast] = useState('');

  const load = useCallback(async () => {
    setLoading(true);
    setEmployees(await service.getAll());
    setLoading(false);
  }, []);
  useEffect(() => { load(); }, [load]);

  useEffect(() => {
    if (!toast) return;
    const t = setTimeout(() => setToast(''), 3500);
    return () => clearTimeout(t);
  }, [toast]);

  const closeForm = useCallback(() => setForm(null), []);
  const handleSaved = async (emp, isNew) => {
    setForm(null);
    setEmployees(await service.getAll());
    setToast(isNew ? `${emp.fullName} added.` : `${emp.fullName} saved.`);
  };
  const confirmDelete = async () => {
    await service.remove(toDelete.id);
    setEmployees(prev => prev.filter(e => e.id !== toDelete.id));
    setToast(`${toDelete.fullName} deleted.`);
    setToDelete(null);
  };
  const resetDemo = async () => {
    service.reset();
    await load();
    setToast('Sample data restored.');
  };

  return (
    <>
      <div className="suite">
        <span className="waffle" aria-hidden="true">{Array.from({ length: 9 }).map((_, i) => <span key={i} />)}</span>
        <span className="brand">SharePoint</span>
        <span className="site">HR Portal</span>
        <span className="me" aria-hidden="true">You</span>
      </div>

      <div className="notice" role="note">
        <span>This is a browser demo with sample data. In SharePoint, the same React components read and write a SharePoint list through the REST API.</span>
        <span className="spacer" />
        <a href={REPO_URL} target="_blank" rel="noopener">View source on GitHub</a>
        <button className="btn" onClick={resetDemo}><Icon name="reset" />Reset sample data</button>
      </div>

      <main className="canvas">
        <section className="wp" aria-labelledby="wp-title">
          <header className="wp-header">
            <div>
              <h1 className="wp-title" id="wp-title">Employee Management</h1>
              <p className="wp-sub">{loading ? 'Loading employees…' : `${employees.length} people in the Employees list`}</p>
            </div>
            <button className="btn btn-primary" onClick={() => setForm({})}><Icon name="plus" />Add employee</button>
          </header>
          <div className="wp-body">
            <div className="tabs" role="tablist" aria-label="Employee views">
              <button className="tab" role="tab" aria-selected={tab === 'directory'} onClick={() => setTab('directory')}><Icon name="people" />Directory</button>
              <button className="tab" role="tab" aria-selected={tab === 'dashboard'} onClick={() => setTab('dashboard')}><Icon name="chart" />Dashboard</button>
            </div>
            {loading ? (
              <div className="empty"><p style={{ margin: 0 }}>Loading employees…</p></div>
            ) : tab === 'directory' ? (
              <Directory employees={employees} onAdd={() => setForm({})} onEdit={(e) => setForm({ employee: e })} onDelete={setToDelete} />
            ) : (
              <Dashboard employees={employees} />
            )}
          </div>
        </section>
      </main>

      <footer>
        Built with SharePoint Framework (SPFx), React and TypeScript · <a href={REPO_URL} target="_blank" rel="noopener">Source code</a>
      </footer>

      {form && <EmployeeForm employee={form.employee} onClose={closeForm} onSaved={handleSaved} />}
      {toDelete && <ConfirmDelete emp={toDelete} onCancel={() => setToDelete(null)} onConfirm={confirmDelete} />}
      {toast && (
        <div className="toast" role="status">
          {toast}
          <button className="icon-btn" aria-label="Dismiss" onClick={() => setToast('')}><Icon name="close" /></button>
        </div>
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
